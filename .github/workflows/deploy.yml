name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            artifact_names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.expired == false) | .name')"
            if printf '%s\n' "$artifact_names" | grep -Fxq "$ARTIFACT_NAME"; then
              echo "Artifact $ARTIFACT_NAME is available."
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for artifact $ARTIFACT_NAME to become visible." >&2
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
        
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true